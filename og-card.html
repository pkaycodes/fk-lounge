<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/bodoni.woff2") format("woff2"); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: "Bodoni Moda"; src: url("assets/fonts/bodoni-italic.woff2") format("woff2"); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    display: grid;
    grid-template-columns: 1.08fr 0.92fr;
    align-items: center;
    gap: 28px;
    padding: 54px 60px;
    background: #0f1b15;
    color: #f2ebdd;
    font-family: "Manrope", sans-serif;
  }
  body::after {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(199, 164, 103, 0.3);
    pointer-events: none;
  }
  .left { position: relative; z-index: 2; padding-left: 10px; }
  .brand { width: 76px; height: 76px; object-fit: contain; margin-bottom: 26px; }
  h1 {
    font-family: "Bodoni Moda", serif;
    font-size: 86px;
    font-weight: 400;
    line-height: 0.9;
    letter-spacing: -0.035em;
  }
  h1 em { display: block; color: #e2cc9e; font-style: italic; }
  .tags {
    margin-top: 28px;
    color: rgba(242, 235, 221, 0.58);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .addr {
    margin-top: 22px;
    color: #c7a467;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .handle {
    margin-top: 10px;
    color: rgba(242, 235, 221, 0.8);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .collage { position: relative; height: 522px; }
  .img { position: absolute; overflow: hidden; border: 8px solid #f2ebdd; box-shadow: 0 22px 46px rgba(0,0,0,0.4); }
  .img img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .a { top: 0; left: 34px; width: 228px; height: 300px; }
  .b { top: 42px; right: 0; width: 182px; height: 234px; }
  .c { bottom: 0; left: 96px; width: 252px; height: 290px; }
  .d { right: 0; bottom: 26px; width: 168px; height: 216px; }
  .mark {
    position: absolute;
    right: -34px; bottom: 118px;
    color: transparent;
    font-family: "Bodoni Moda", serif;
    font-size: 260px;
    line-height: 1;
    -webkit-text-stroke: 1px rgba(199, 164, 103, 0.14);
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="mark">FK</div>
  <div class="left">
    <img class="brand" src="assets/img/logo-cream.png" alt="FK Lounge">
    <h1>Slow sips.<em>Loud nights.</em></h1>
    <p class="tags">Cocktails · Live bands · Pool · Karaoke</p>
    <p class="addr">K Boat · Dome Pillar 2 · Accra, Ghana</p>
    <p class="handle">@fkloungegh</p>
  </div>
  <div class="collage">
    <div class="img a"><img src="assets/img/about-main.webp" alt=""></div>
    <div class="img b"><img src="assets/img/exp-stage.webp" alt=""></div>
    <div class="img c"><img src="assets/img/g-exterior.webp" alt=""></div>
    <div class="img d"><img src="assets/img/g-foliage.webp" alt=""></div>
  </div>
</body>
</html>
